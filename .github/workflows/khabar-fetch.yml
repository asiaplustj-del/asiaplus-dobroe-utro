name: khabar-fetch
# «Хабарҳои шаб»: скачивает страницы и фото по списку из khabar/requests/<id>.txt
# и кладёт результат в khabar/fetched/<id>/ (среда Claude сама эти сайты открыть не может).
on:
  push:
    paths: ["khabar/requests/*.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: khabar-fetch, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 khabar/fetch.py
      - name: commit
        run: |
          git config user.name "asiaplustj-del"
          git config user.email "jadidasiaplus@gmail.com"
          git add khabar/fetched
          git diff --cached --quiet && exit 0
          git commit -m "khabar: fetched"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 3; done
