<!doctype html>
<html lang="tg"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Хабарҳои шаб</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --red:#E3232C; --red-hi:#FF4A52; --navy:#14254A;
  --bg0:#08080B; --bg1:#121217;
  --fg:#FFFFFF; --fg2:#C9CBD3; --fg3:#8A8D99; --line:rgba(255,255,255,.12);
  --text:Text,"SF Pro Display","Inter",system-ui,sans-serif; --brand:Brand,"Nunito",sans-serif;
  --M:72px; /* одинаковые поля слева и справа */
}
html,body{margin:0;height:100%;background:#000}
body{display:grid;place-items:center;font-family:var(--text)}
.vp{position:relative;overflow:hidden}
.stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;color:var(--fg);
  background:radial-gradient(130% 60% at 50% 0%,#1A1A22 0%,var(--bg1) 40%,var(--bg0) 100%)}
body.render .vp{width:1080px;height:1920px}

/* ---------- фон ---------- */
.bg{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(46px) saturate(1.1) brightness(.42);opacity:0}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,11,.7) 0%,rgba(8,8,11,.35) 35%,rgba(8,8,11,.85) 100%)}
.glow{position:absolute;left:-250px;right:-250px;bottom:-640px;height:1000px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(227,35,44,.38),rgba(227,35,44,.1) 55%,transparent);animation:breathe 7s ease-in-out infinite}
.orn{position:absolute;left:50%;top:-560px;width:1300px;height:1300px;margin-left:-650px;opacity:.28;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.06);opacity:.8}}

/* ---------- шапка: главное — название рубрики ---------- */
.head{position:absolute;left:var(--M);right:var(--M);top:205px;text-align:center}
.brandrow{display:flex;align-items:center;justify-content:center;gap:24px}
.logo{width:118px;height:118px;flex:0 0 auto}
.logo svg{width:100%;height:100%;overflow:visible}
.logo .hand{transform-box:view-box;transform-origin:60px 60px}
.title{font-family:var(--brand);font-weight:700;font-size:104px;line-height:1;letter-spacing:.01em;white-space:nowrap;color:#fff;text-transform:uppercase}
.sub{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:18px;font-size:32px;font-weight:500;color:var(--fg2)}
.sub i{width:56px;height:3px;background:var(--red);border-radius:2px}
.sub b{font-weight:700;color:var(--fg)}

/* ---------- главная новость ---------- */
.hero{position:absolute;left:var(--M);right:var(--M);top:470px}
.photo{position:relative;height:560px;border-radius:40px;overflow:hidden;background:#1B1B22;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.photo .im{position:absolute;inset:0;background-size:cover;background-position:center}
.photo .fb{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(closest-side,rgba(227,35,44,.28),transparent)}
.photo .fb svg{width:260px;height:260px}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(8,8,11,.5))}
.chip{display:inline-flex;align-items:center;gap:12px;margin:40px 0 20px;padding:12px 26px 12px 20px;border-radius:99px;
  font-size:28px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--red);color:#fff}
.chip svg{width:32px;height:32px}
.htitle{font-size:76px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.hl{display:block;overflow:hidden;padding-bottom:6px}.hl>span{display:inline-block}

/* ---------- список ---------- */
.list{position:absolute;left:var(--M);right:var(--M);top:470px}
.item{display:grid;grid-template-columns:76px 1fr;column-gap:26px;padding:22px 0 24px;border-bottom:2px solid var(--line)}
.num{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;
  font-weight:700;font-size:38px;margin-top:4px;font-variant-numeric:tabular-nums}
.cat{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin-bottom:6px}
.cat svg{width:26px;height:26px}
.txt{font-size:50px;font-weight:600;line-height:1.14;letter-spacing:-.015em}

/* ---------- «подробнее» — ниже безопасной зоны, второстепенно ---------- */
.cta{position:absolute;left:var(--M);right:var(--M);top:1720px;display:flex;align-items:center;justify-content:center;gap:16px;
  font-size:30px;font-weight:500;color:var(--fg2)}
.cta b{font-family:var(--brand);font-weight:700;color:var(--fg);font-size:36px}
.cta i{width:14px;height:14px;border-radius:50%;background:var(--red)}

/* ---------- водяной знак asia+ ---------- */
.wm{position:absolute;top:0;font-family:var(--brand);font-weight:700;font-size:62px;line-height:1;color:#fff;opacity:0;
  text-shadow:0 2px 14px rgba(0,0,0,.4);z-index:5;pointer-events:none}
.wm-r{right:40px}.wm-l{left:40px}
.play .wm-r{animation:wmDown 20s linear infinite}
.play .wm-l{animation:wmUp 20s linear infinite}
@keyframes wmDown{0%{transform:translateY(50px);opacity:0}5%{opacity:.35}55%{opacity:.35}60%{transform:translateY(1700px);opacity:0}100%{transform:translateY(1700px);opacity:0}}
@keyframes wmUp{0%,55%{transform:translateY(1700px);opacity:0}60%{opacity:.35}96.5%{opacity:.35}100%{transform:translateY(470px);opacity:0}}

/* ---------- анимация ---------- */
.play .a-title{animation:titleIn 1.1s cubic-bezier(.16,1,.3,1) both;animation-delay:.15s}
.play .a-logo{animation:logoIn .9s cubic-bezier(.3,1.5,.4,1) both}
.play .logo .hand{animation:sweep 1.6s cubic-bezier(.5,0,.15,1) both;animation-delay:.35s}
.play .item.ud{animation:itemIn .75s cubic-bezier(.16,1.1,.3,1) both,dim .6s ease both,undim .8s ease forwards;animation-delay:var(--d),var(--dd),var(--ud)}
@keyframes logoIn{from{opacity:0;transform:scale(.4) rotate(-60deg)}}
@keyframes sweep{from{transform:rotate(-180deg)}to{transform:rotate(0)}}
@keyframes undim{from{opacity:.6}to{opacity:1}}
.play .a-in{animation:rise .8s cubic-bezier(.2,.9,.1,1) both;animation-delay:var(--d,0s)}
.play .a-pop{animation:pop .9s cubic-bezier(.16,1.15,.3,1) both;animation-delay:var(--d,0s)}
.play .hl>span{animation:rise .8s cubic-bezier(.2,.9,.1,1) both;animation-delay:var(--d,0s)}
.play .photo .im{animation:ken 6s linear both}
.play .hero{animation:heroOut .55s cubic-bezier(.7,0,.8,.4) both;animation-delay:var(--hx)}
.play .item{animation:itemIn .75s cubic-bezier(.16,1.1,.3,1) both,dim .6s ease both;animation-delay:var(--d),var(--dd)}
.play .item.last{animation:itemIn .75s cubic-bezier(.16,1.1,.3,1) both;animation-delay:var(--d)}
.play .bg{animation:bgIn 1.2s ease both;animation-delay:var(--d)}
.play .cta{animation:rise .8s cubic-bezier(.2,.9,.1,1) both;animation-delay:var(--d)}
.play .all{animation:out .6s cubic-bezier(.7,0,.8,.4) both;animation-delay:var(--end)}
@keyframes titleIn{0%{opacity:0;transform:scale(.86);filter:blur(14px);letter-spacing:.06em}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes rise{from{transform:translateY(110%);opacity:0}}
@keyframes pop{0%{opacity:0;transform:translateY(60px) scale(.93);filter:blur(8px)}50%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none}}
@keyframes ken{from{transform:scale(1.02)}to{transform:scale(1.14) translateY(-12px)}}
@keyframes heroOut{to{opacity:0;transform:translateY(-40px) scale(.97);filter:blur(6px)}}
@keyframes itemIn{0%{opacity:0;transform:translateY(40px)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes dim{to{opacity:.6}}
@keyframes bgIn{from{opacity:0}to{opacity:1}}
@keyframes out{to{opacity:0;transform:translateY(-24px)}}
</style></head>
<body>
<div class="vp" id="vp"><div class="stage" id="stage">
  <div id="bgs"></div><div class="shade"></div>
  <div class="glow"></div>
  <svg class="orn" viewBox="0 0 720 720" aria-hidden="true" id="orn"></svg>
  <div class="all" id="all"></div>
  <div class="wm wm-r" aria-hidden="true">asia+</div>
  <div class="wm wm-l" aria-hidden="true">asia+</div>
</div></div>
<script>
const MON=["январ","феврал","март","апрел","май","июн","июл","август","сентябр","октябр","ноябр","декабр"];
const WD=["якшанбе","душанбе","сешанбе","чоршанбе","панҷшанбе","ҷумъа","шанбе"];
const CAT={
  muhojirat:["Муҳоҷират",'<rect x="4" y="10" width="24" height="17" rx="4"/><path d="M12 10V7a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v3M4 17h24"/>'],
  hodisa:["Ҳодиса",'<path d="M16 4l13 23H3z"/><path d="M16 13v6"/><circle cx="16" cy="23" r="1"/>'],
  siyosat:["Сиёсат",'<path d="M4 12h24L16 5z"/><path d="M7 13v10M13 13v10M19 13v10M25 13v10M4 27h24"/>'],
  qonun:["Қонун",'<path d="M16 5v22M8 27h16M5 10h22"/><path d="M8 10l-4 9h8zM24 10l-4 9h8z"/>'],
  tandurusti:["Тандурустӣ",'<rect x="5" y="5" width="22" height="22" rx="6"/><path d="M16 10v12M10 16h12"/>'],
  varzish:["Варзиш",'<circle cx="16" cy="19" r="8"/><path d="M11 4l5 7 5-7"/><path d="M16 16v6M13 19h6"/>'],
  iqtisod:["Иқтисод",'<path d="M5 26h22"/><path d="M8 21l6-6 4 4 8-9"/><path d="M21 10h5v5"/>'],
  jahon:["Ҷаҳон",'<circle cx="16" cy="16" r="11"/><path d="M5 16h22M16 5c-4 4-4 18 0 22M16 5c4 4 4 18 0 22"/>'],
  jomea:["Ҷомеа",'<circle cx="11" cy="11" r="4"/><circle cx="22" cy="12" r="3"/><path d="M4 26c0-5 3-8 7-8s7 3 7 8M18 25c0-4 2-6 4-6s5 2 5 6"/>'],
  obuhavo:["Обу ҳаво",'<circle cx="12" cy="12" r="5"/><path d="M12 2v2M2 12h2M5 5l1.5 1.5"/><path d="M11 26h13a5 5 0 0 0 0-10 7 7 0 0 0-13 3 4 4 0 0 0 0 7z"/>'],
};
const ico=(k,stroke)=>`<svg viewBox="0 0 32 32" fill="none" stroke="${stroke}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${(CAT[k]||CAT.jomea)[1]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function ornament(){let s='<g fill="none" stroke="#E3232C" stroke-width="2" stroke-opacity=".8">';
  s+='<circle cx="360" cy="360" r="346" stroke-dasharray="2 18" stroke-linecap="round"/><circle cx="360" cy="360" r="310" stroke-opacity=".4"/>';
  const p=(r,a)=>[360+r*Math.cos(a),360+r*Math.sin(a)];
  for(let k=0;k<2;k++){let d="";for(let i=0;i<4;i++){const q=p(240,k*Math.PI/4+i*Math.PI/2);d+=(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)}s+=`<path d="${d}Z"/>`}
  let d="";for(let i=0;i<16;i++){const q=p(i%2?130:215,i*Math.PI/8);d+=(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)}
  return s+`<path d="${d}Z" stroke="#ffffff" stroke-opacity=".35"/></g>`}

// строки заголовка главной: жадно по ширине, без коротких «хвостов»
function lines(t,max){const w=t.split(" "),o=[];let c="";
  for(const x of w){if((c+" "+x).trim().length>max&&c){o.push(c);c=x}else c=(c+" "+x).trim()}
  if(c)o.push(c);if(o.length>1&&o[o.length-1].length<8){const a=o.pop();o[o.length-1]+=" "+a}return o}

const LOGO=`<svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
  <defs><mask id="hs-moon"><rect width="120" height="120" fill="#fff"/><circle cx="50" cy="35" r="12" fill="#000"/></mask></defs>
  <path d="M10 60a50 50 0 0 0 100 0" stroke="#fff" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"/>
  <path d="M10 60a50 50 0 0 1 100 0" stroke="#E3232C" stroke-width="8" stroke-linecap="round"/>
  <path d="M60 94v7" stroke="#fff" stroke-opacity=".6" stroke-width="5" stroke-linecap="round"/>
  <circle cx="42" cy="42" r="14" fill="#fff" mask="url(#hs-moon)"/>
  <g class="hand"><path d="M60 60h30" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g>
  <circle cx="60" cy="60" r="7" fill="#E3232C" stroke="#fff" stroke-width="3"/></svg>`;
let data=null;
function build(D){
  const day=new Date(D.date+"T07:00:00"), items=D.items, n=items.length;
  // всё показано к ~18–19 с, затем список держится полностью ещё ~8 с, чтобы успели дочитать
  const HX=5.0, L0=5.4, STEP=n>6?1.9:n>5?2.2:2.5;
  const lastIn=L0+(n-1)*STEP, CTA=lastIn+1.0, UD=lastIn+1.6;
  const DUR=Math.ceil(lastIn+10), END=DUR-0.6;
  const main=items[0];

  document.getElementById("bgs").innerHTML=items.map((it,i)=>it.img?`<div class="bg" style="background-image:url('${it.img}');--d:${i?(L0+i*STEP-.2).toFixed(2):"0.2"}s"></div>`:"").join("");

  const head=`<div class="head">
    <div class="brandrow"><div class="logo a-logo">${LOGO}</div><div class="title a-title">Хабарҳои шаб</div></div>
    <div class="sub a-in" style="--d:.45s"><i></i><span><b>${day.getDate()} ${MON[day.getMonth()]}</b> · ${WD[day.getDay()]}</span><i></i></div>
  </div>`;

  const hero=`<div class="hero" style="--hx:${HX}s">
    <div class="photo a-pop" style="--d:.5s">${main.img?`<div class="im" style="background-image:url('${main.img}')"></div>`:`<div class="fb">${ico(main.cat,"#FF4A52")}</div>`}</div>
    <div class="chip a-pop" style="--d:.95s">${ico(main.cat,"#fff")}${(CAT[main.cat]||CAT.jomea)[0]}</div>
    <div class="htitle">${lines(main.text,22).map((l,i)=>`<span class="hl"><span style="--d:${(1.1+i*.14).toFixed(2)}s">${esc(l)}</span></span>`).join("")}</div>
  </div>`;

  const list=`<div class="list">${items.map((it,i)=>{const d=L0+i*STEP;
    return `<div class="item${i===n-1?" last":" ud"}" style="--d:${d.toFixed(2)}s;--dd:${(d+STEP).toFixed(2)}s;--ud:${UD.toFixed(2)}s">
      <div class="num">${i+1}</div>
      <div><div class="cat">${ico(it.cat,"#FF4A52")}${(CAT[it.cat]||CAT.jomea)[0]}</div><div class="txt">${esc(it.text)}</div></div>
    </div>`}).join("")}</div>`;

  const cta=`<div class="cta" style="--d:${CTA.toFixed(2)}s"><i></i>Муфассал дар давоми рӯз — <b>asiaplus.news</b></div>`;

  const all=document.getElementById("all");
  all.style.setProperty("--end",END+"s");
  all.innerHTML=head+hero+list+cta;
  // название рубрики вместе с логотипом — во всю ширину между полями
  const T=all.querySelector(".title"),R=all.querySelector(".brandrow");let ts=104;
  while(R.scrollWidth>936&&ts>70){ts-=2;T.style.fontSize=ts+"px"}
  // список заканчивается до y≈1665 (дальше — плашка «муфассал»); не влезает — уменьшаем кегль
  let fs=50;const L=all.querySelector(".list");
  while(L.offsetTop+L.offsetHeight>1665&&fs>36){fs-=1;all.querySelectorAll(".txt").forEach(e=>e.style.fontSize=fs+"px")}
  // главная: если заголовок длинный — тоже ужимаем, чтобы не залезть в нижнюю зону
  let hs=76;const H=all.querySelector(".hero");
  while(H.offsetTop+H.offsetHeight>1560&&hs>56){hs-=2;all.querySelector(".htitle").style.fontSize=hs+"px"}
  // моменты для звука: заголовок главной + каждый пункт
  const cues=[1.1].concat(items.map((_,i)=>+(L0+i*STEP).toFixed(2)));
  return {dur:DUR,fs,hs,listBottom:L.offsetTop+L.offsetHeight,cues};
}

function start(){const st=document.getElementById("stage");const r=build(data);st.classList.remove("play");void st.offsetWidth;st.classList.add("play");
  document.getAnimations().forEach(a=>{a.currentTime=0});return r}
window.renderSetup=d=>{data=d;const r=start();document.getAnimations().forEach(a=>a.pause());seek(0);return r};
window.seek=t=>{document.getAnimations().forEach(a=>{a.currentTime=t*1000})};

document.getElementById("orn").innerHTML=ornament();
if(location.search.includes("render")){document.body.classList.add("render")}
else{
  const fit=()=>{const s=Math.min((innerHeight-24)/1920,(innerWidth-24)/1080);const vp=document.getElementById("vp");
    vp.style.width=1080*s+"px";vp.style.height=1920*s+"px";document.getElementById("stage").style.transform=`scale(${s})`};
  addEventListener("resize",fit);fit();
  fetch("data.json").then(r=>r.json()).then(d=>{data=d;const loop=()=>{const r=start();setTimeout(loop,r.dur*1000)};loop()}).catch(()=>{});
}
</script>
</body></html>
