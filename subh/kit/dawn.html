<!doctype html><html><head><meta charset="utf-8"><title>Рассвет</title>
<style>
html,body{margin:0;background:#000}
.stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;
  background:linear-gradient(180deg,#CADCEC 0%,#E7EDF2 46%,#F7E9DA 100%)}
.l{position:absolute;inset:0}
.night{background:radial-gradient(130% 60% at 50% 0%,#1A1A22 0%,#121217 40%,#08080B 100%);animation:nightOut .9s cubic-bezier(.5,0,.6,1) both}
.twi{background:linear-gradient(180deg,#232A52 0%,#5B3E72 38%,#C46A62 72%,#F5A25A 100%);animation:twi 1.5s ease-in-out both}
.sun{left:auto;inset:auto;right:-330px;top:-260px;width:900px;height:900px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,140,.95) 0%,rgba(248,198,111,.45) 32%,rgba(248,198,111,.12) 52%,transparent 68%);
  animation:rise 1.5s cubic-bezier(.25,.8,.3,1) both}
.star{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;animation:starOut .7s ease both}
@keyframes nightOut{0%{opacity:1}100%{opacity:0}}
@keyframes twi{0%{opacity:0}30%{opacity:1}55%{opacity:1}100%{opacity:0}}
@keyframes rise{0%{transform:translate(-120px,1700px) scale(.6);opacity:.0}25%{opacity:1}100%{transform:none;opacity:.6}}
@keyframes starOut{0%{opacity:.8}100%{opacity:0;transform:translateY(-40px)}}
</style></head><body>
<div class="stage" id="stage">
  <div class="l twi"></div>
  <div class="l night"></div>
  <div id="stars"></div>
  <div class="l sun"></div>
</div>
<script>
let h="";for(let i=0;i<40;i++){h+=`<span class="star" style="left:${(i*137)%1060}px;top:${(i*263)%1200}px;opacity:${.3+(i%5)*.12}"></span>`}
document.getElementById("stars").innerHTML=h;
window.renderSetup=()=>{document.getAnimations().forEach(a=>{a.currentTime=0;a.pause()});return {dur:1.5}};
window.seek=t=>{document.getAnimations().forEach(a=>{a.currentTime=t*1000})};
</script></body></html>
