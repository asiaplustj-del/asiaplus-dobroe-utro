<!doctype html><html lang="tg"><head><meta charset="utf-8"><title>Обу ҳаво ва қурби асъор</title>
<link rel="stylesheet" href="fonts/fonts.css"><style>
/* Layout: фиксированная сцена 1080×1920, масштабируется под экран; панель данных рядом (на телефоне — под сценой) */
:root{
  --ink:#16243A; --ink-2:#55667E; --ink-3:#8C9AAE;
  --sky-top:#CADCEC; --sky-mid:#E7EDF2; --sky-low:#F7E9DA;
  --sun:#F09A2E; --sun-soft:#F8C66F;
  --card:rgba(255,255,255,.66); --card-edge:rgba(255,255,255,.9); --line:rgba(22,36,58,.10);
  --up:#2C9466; --down:#CF4F3B;
  --page:#0E1828; --panel:#162238; --panel-2:#1E2D47; --panel-fg:#E4EAF3; --panel-mute:#93A2BA;
  --display:Text,sans-serif;
  --body:Text,sans-serif;
  --logo:Brand,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--page);color:var(--panel-fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding-block:20px;flex-wrap:wrap}
.viewport{position:relative;flex:0 0 auto;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;color:var(--ink);font-family:var(--body);
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 46%,var(--sky-low) 100%)}
body.render{padding:0;background:var(--sky-mid)}
body.render .wrap{padding:0;display:block}
body.render .panel{display:none}
body.render .viewport{border-radius:0;box-shadow:none;width:1080px;height:1920px}

/* ---------- фон ---------- */
.glow{position:absolute;width:900px;height:900px;right:-330px;top:-260px;border-radius:50%;
  background:radial-gradient(circle,rgba(248,198,111,.55) 0%,rgba(248,198,111,.18) 40%,transparent 68%);animation:breathe 6s ease-in-out infinite}
.ring{position:absolute;right:-210px;top:-150px;width:640px;height:640px;animation:spin 48s linear infinite}
.ring2{position:absolute;right:-120px;top:-60px;width:460px;height:460px;animation:spin 30s linear infinite reverse}
.haze{position:absolute;left:-300px;bottom:180px;width:1000px;height:520px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.7),transparent);animation:drift 14s ease-in-out infinite alternate}
.dot{position:absolute;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.85);animation:float 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.08);opacity:.85}}
@keyframes drift{to{transform:translateX(260px)}}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-520px);opacity:0}}

/* ---------- контент ---------- */
.content{position:absolute;inset:0;padding:200px 72px 0}
.wd{font-size:28px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2)}
.date{font-family:var(--display);font-weight:500;font-size:68px;line-height:1.05;letter-spacing:-.01em;margin-top:8px}
.mask{display:block;overflow:hidden;padding-bottom:6px}
.mask>span{display:inline-block}
.label{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);margin:20px 0 12px}
.label>.mask{flex:0 0 auto}
.label i{flex:1;height:2px;background:var(--line);transform-origin:left}
.label .src{font-size:22px;font-weight:500;letter-spacing:.04em;text-transform:none;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{position:relative;overflow:hidden;background:var(--card);border:2px solid var(--card-edge);border-radius:44px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 40px rgba(40,64,96,.10)}
.card::after{content:"";position:absolute;inset:-20% auto -20% -60%;width:40%;transform:skewX(-18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);opacity:0}
/* карточка города: название сверху, максимум точно по центру, минимум под ним, состояние внизу */
.city{height:300px}
.cname{position:absolute;left:32px;top:30px;font-size:38px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:1.1}
.ico{position:absolute;right:22px;top:20px;width:100px;height:100px}
.ico svg{width:100%;height:100%;overflow:visible}
.tblock{position:absolute;left:0;right:0;top:57%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center}
.temp{position:relative;font-family:var(--display);font-weight:700;font-size:112px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.temp sup{position:absolute;left:100%;top:.06em;font-size:.4em;margin-left:6px;color:var(--sun);line-height:1}
.min{margin-top:12px;padding:6px 20px;border-radius:99px;background:rgba(22,36,58,.06);
  font-size:27px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cond{position:absolute;left:24px;right:24px;bottom:20px;text-align:center;font-size:23px;font-weight:500;color:var(--ink-2);line-height:1.2}

/* одна общая сетка на обе строки: стрелки и цифры стоят на одних вертикалях */
.fx{padding:10px 44px 10px 30px;display:grid;grid-template-columns:78px 1fr 70px auto;column-gap:24px}
.row{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:center;height:98px}
.trend{justify-self:center}
.row+.row{border-top:2px solid var(--line)}
.badge{width:78px;height:78px;perspective:400px}
.badge b{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--ink);color:#fff;
  font-family:var(--display);font-weight:700;font-size:36px;animation:flip 6s cubic-bezier(.6,0,.2,1) infinite}
.row:nth-child(2) .badge b{animation-delay:2s}
.row:nth-child(3) .badge b{animation-delay:4s}
@keyframes flip{0%,70%{transform:rotateY(0)}85%,100%{transform:rotateY(360deg)}}
.cur small{display:block;font-size:24px;font-weight:500;color:var(--ink-2)}
.cur strong{font-family:var(--display);font-weight:700;font-size:34px}
.trend{width:70px;height:80px;overflow:visible}
.trend .ln{fill:none;stroke-width:5;stroke-linecap:round}
.trend .hd{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.trend .mv{animation:nudge 1.6s ease-in-out infinite}
.trend.up .mv{--dx:0px;--dy:-7px}.trend.down .mv{--dx:0px;--dy:7px}.trend.flat .mv{--dx:6px;--dy:0px}
@keyframes nudge{50%{transform:translate(var(--dx),var(--dy))}}
.val{text-align:right}
.val .n{font-family:var(--display);font-weight:700;font-size:64px;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:4px 12px;border-radius:99px;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.pill.up{color:var(--up);background:rgba(44,148,102,.12)}
.pill.down{color:var(--down);background:rgba(207,79,59,.12)}
.pill.flat{color:var(--ink-2);background:rgba(22,36,58,.06)}

/* ---------- иконки погоды (все элементы внутри поля 0–120 с запасом на движение) ---------- */
.ico .rays{animation:spin 14s linear infinite}
.ico .core{animation:breathe 3.2s ease-in-out infinite}
.ico .cl{animation:sway 4.5s ease-in-out infinite alternate}
.ico .cl.b{animation-duration:6s;animation-direction:alternate-reverse}
.ico .drop{animation:drop 1.3s linear infinite}
.ico .flake{transform-box:fill-box;transform-origin:center;animation:snow 2.6s linear infinite}
.ico .hz{animation:sway 3.6s ease-in-out infinite alternate}
.ico .hz.b{animation-direction:alternate-reverse;animation-duration:4.4s}
@keyframes sway{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
@keyframes drop{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(16px);opacity:0}}
@keyframes snow{0%{transform:translateY(-6px) rotate(0);opacity:0}25%{opacity:1}100%{transform:translateY(16px) rotate(180deg);opacity:0}}

/* ---------- вступление ---------- */
.play .a-bg{animation:fadeScale 1.4s cubic-bezier(.2,.8,.2,1) both}
.play .mask>span{animation:rise .9s cubic-bezier(.2,.9,.1,1) both;animation-delay:var(--d,0s)}
.play .a-line{animation:draw 1s cubic-bezier(.7,0,.2,1) both;animation-delay:var(--d,0s)}
.play .a-pop{animation:pop 1s cubic-bezier(.16,1.25,.3,1) both;animation-delay:var(--d,0s)}
.play .a-ico{animation:icoIn .9s cubic-bezier(.3,1.6,.4,1) both;animation-delay:var(--d,0s)}
.play .a-slide{animation:slide .9s cubic-bezier(.16,1.15,.3,1) both;animation-delay:var(--d,0s)}
.play .trend .ln{stroke-dasharray:80;animation:dash .8s cubic-bezier(.6,0,.2,1) both;animation-delay:var(--d,0s)}
.play .trend .hd{animation:headIn .5s cubic-bezier(.3,1.6,.4,1) both;animation-delay:calc(var(--d,0s) + .6s)}
.play .card::after{animation:shine 3.4s ease-in-out infinite;animation-delay:var(--sd,3s)}
.play .content{animation:out .7s cubic-bezier(.7,0,.8,.4) 14.3s both}
@keyframes fadeScale{from{opacity:0;transform:scale(.6) rotate(-40deg)}}
@keyframes rise{from{transform:translateY(115%)}}
@keyframes draw{from{transform:scaleX(0)}}
@keyframes pop{0%{opacity:0;transform:translateY(90px) scale(.86);filter:blur(8px)}45%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none}}
@keyframes icoIn{from{opacity:0;transform:scale(0) rotate(-120deg)}}
@keyframes slide{0%{opacity:0;transform:translateX(-120px)}50%{opacity:1}100%{opacity:1;transform:none}}
@keyframes dash{from{stroke-dashoffset:80}}
@keyframes headIn{from{opacity:0}}
@keyframes shine{0%{left:-60%;opacity:0}8%{opacity:1}40%,100%{left:130%;opacity:0}}
@keyframes out{to{opacity:0;transform:translateY(-40px) scale(.98)}}

/* ---------- водяной знак asia+ (цикл 20 с, ~137 px/с) ---------- */
.wm{position:absolute;top:0;font-family:var(--logo);font-weight:700;font-size:62px;letter-spacing:-.01em;line-height:1;
  color:#fff;opacity:0;text-shadow:0 2px 14px rgba(22,36,58,.22);pointer-events:none;z-index:5;will-change:transform,opacity}
.wm-r{right:52px}
.wm-l{left:52px}
.play .wm-r{animation:wmDown 20s linear infinite}
.play .wm-l{animation:wmUp 20s linear infinite}
/* правый: сверху вниз до y≈1700 (0–12 с), гаснет; левый: появляется там же и поднимается (11–20 с) */
@keyframes wmDown{
  0%{transform:translateY(50px);opacity:0} 5%{opacity:.7} 55%{opacity:.7}
  60%{transform:translateY(1700px);opacity:0} 100%{transform:translateY(1700px);opacity:0}}
@keyframes wmUp{
  0%,55%{transform:translateY(1700px);opacity:0} 60%{opacity:.7} 96.5%{opacity:.7}
  100%{transform:translateY(470px);opacity:0}}


/* ---------- шапка как в «Хабарҳои шаб» ---------- */
.head{text-align:center}
.brandrow{display:flex;align-items:center;justify-content:center;gap:24px}
.logo{width:150px;height:150px;flex:0 0 auto}.logo svg{width:100%;height:100%;overflow:visible}
.logo .hand{transform-box:view-box;transform-origin:60px 60px}
.title{font-family:var(--display);font-weight:700;font-size:80px;line-height:.96;letter-spacing:-.025em;white-space:nowrap;color:var(--ink);text-transform:uppercase;text-align:left}
.title span{display:block}
.sub{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:26px;font-size:32px;font-weight:500;color:var(--ink-2)}
.sub i{width:56px;height:3px;background:var(--sun);border-radius:2px}.sub b{font-weight:700;color:var(--ink)}
.play .a-title{animation:titleIn 1.1s cubic-bezier(.16,1,.3,1) both;animation-delay:.15s}
.play .a-logo{animation:logoIn .9s cubic-bezier(.3,1.5,.4,1) both}
.play .logo .hand{animation:sweep 1.6s cubic-bezier(.5,0,.15,1) both;animation-delay:.35s}
.play .a-in{animation:rise2 .8s cubic-bezier(.2,.9,.1,1) both;animation-delay:var(--d,0s)}
@keyframes titleIn{0%{opacity:0;transform:scale(.86);filter:blur(14px);letter-spacing:.02em}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes logoIn{from{opacity:0;transform:scale(.4) rotate(-60deg)}}
@keyframes sweep{from{transform:rotate(-180deg)}to{transform:rotate(0)}}
@keyframes rise2{from{transform:translateY(110%);opacity:0}}
html,body{margin:0;background:#000}.stage{position:absolute;left:0;top:0}
</style></head><body>
<div class="stage" id="stage">
  <div class="glow a-bg"></div>
  <svg class="ring a-bg" viewBox="0 0 640 640" aria-hidden="true"><circle cx="320" cy="320" r="300" fill="none" stroke="#F09A2E" stroke-opacity=".45" stroke-width="3" stroke-dasharray="2 22" stroke-linecap="round"/></svg>
  <svg class="ring2 a-bg" viewBox="0 0 460 460" aria-hidden="true"><circle cx="230" cy="230" r="215" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="2" stroke-dasharray="120 40 8 40"/></svg>
  <div class="haze"></div><div id="dots"></div>
  <div class="content" id="content"></div>
  <div class="wm wm-r" aria-hidden="true">asia+</div><div class="wm wm-l" aria-hidden="true">asia+</div>
</div>
<script>
const ICONS={sun:"Соф",few:"Камабр",partly:"Тағйирёбанда",cloud:"Абрнок",rain:"Борон",snow:"Барф",haze:"Чангу ғубор"};
let data=null;
const CL="M30 92h58a20 20 0 0 0 1-40a27 27 0 0 0-52 7a17 17 0 0 0-7 33z"; // облако занимает x≈23–108, y≈38–92
function cloud(cls,tx,ty,s,fill){return `<g class="cl ${cls}"><path d="${CL}" transform="translate(${tx} ${ty}) scale(${s})" fill="${fill}" stroke="#16243A" stroke-width="${(5/s).toFixed(2)}" stroke-linejoin="round"/></g>`}
function sunG(cx,cy,r){let rays="";for(let i=0;i<8;i++){const a=i*Math.PI/4,r1=r+9,r2=r+19;
  rays+=`<line x1="${(cx+Math.cos(a)*r1).toFixed(1)}" y1="${(cy+Math.sin(a)*r1).toFixed(1)}" x2="${(cx+Math.cos(a)*r2).toFixed(1)}" y2="${(cy+Math.sin(a)*r2).toFixed(1)}"/>`}
  return `<g class="rays" style="transform-origin:${cx}px ${cy}px" stroke="#F09A2E" stroke-width="7" stroke-linecap="round">${rays}</g><circle class="core" style="transform-origin:${cx}px ${cy}px" cx="${cx}" cy="${cy}" r="${r}" fill="#F09A2E"/>`}
function icon(c){
  let s="";
  if(c==="sun") s=sunG(60,60,26);
  if(c==="few") s=sunG(54,50,24)+cloud("",34,34,.66,"#fff");
  if(c==="partly") s=sunG(44,42,17)+cloud("",10,12,.88,"#fff");
  if(c==="cloud") s=cloud("b",4,-4,.72,"#DCE5EE")+cloud("",14,14,.82,"#fff");
  if(c==="rain"){s=cloud("",6,-14,.9,"#fff");
    [[44,0],[60,.4],[76,.8]].forEach(([x,d])=>s+=`<line class="drop" style="animation-delay:${d}s" x1="${x}" y1="84" x2="${x-4}" y2="96" stroke="#3E7FC1" stroke-width="6" stroke-linecap="round"/>`)}
  if(c==="snow"){s=cloud("",6,-14,.9,"#fff");
    [[44,0],[60,.9],[76,1.7]].forEach(([x,d])=>s+=`<circle class="flake" style="animation-delay:${d}s" cx="${x}" cy="90" r="5" fill="#7FA7CF"/>`)}
  if(c==="haze"){s=sunG(60,46,20);
    s+=`<g class="hz" stroke="#8C9AAE" stroke-width="6" stroke-linecap="round"><line x1="24" y1="86" x2="84" y2="86"/><line x1="40" y1="104" x2="96" y2="104"/></g>`}
  return `<svg viewBox="0 0 120 120" aria-hidden="true">${s}</svg>`}
const fmtT=v=>{const r=Math.round(v);return (r>0?"+":r<0?"−":"")+Math.abs(r)};
const fmtR=(v,d)=>v.toLocaleString("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// вертикальная стрелка: вверх — зелёная, вниз — красная, без изменений — серая черта
function trend(c,d){
  const k=c>0?"up":c<0?"down":"flat",col=c>0?"#2C9466":c<0?"#CF4F3B":"#8C9AAE";
  let g;
  if(k==="up") g=`<line class="ln" x1="35" y1="70" x2="35" y2="12" stroke="${col}"/><path class="hd" d="M21 26L35 12L49 26" stroke="${col}"/>`;
  else if(k==="down") g=`<line class="ln" x1="35" y1="10" x2="35" y2="68" stroke="${col}"/><path class="hd" d="M21 54L35 68L49 54" stroke="${col}"/>`;
  else g=`<line class="ln" x1="10" y1="40" x2="52" y2="40" stroke="${col}"/><circle class="hd" cx="60" cy="40" r="6" fill="${col}" stroke="none"/>`;
  return `<svg class="trend ${k}" viewBox="0 0 70 80" style="--d:${d}s" aria-hidden="true"><g class="mv">${g}</g></svg>`}

function render(){
  const D=data, el=document.getElementById("content");
  const cities=D.cities.map((c,i)=>{const d=(.62+i*.12).toFixed(2);
    return `<div class="card city a-pop" style="--d:${d}s;--sd:${3+i*.25}s">
      <div class="cname">${esc(c.n)}</div>
      <div class="ico a-ico" style="--d:${(+d+.25).toFixed(2)}s">${icon(c.c)}</div>
      <div class="tblock">
        <div class="temp"><span data-to="${c.mx}" data-k="t">${fmtT(c.mx)}</span><sup>°</sup></div>
        <div class="min">${fmtT(c.mn)}°</div>
      </div>
      <div class="cond">${esc(c.t||ICONS[c.c])}</div>
    </div>`}).join("");
  const row=(sym,name,code,o,d)=>{const cls=o.c>0?"up":o.c<0?"down":"flat";
    const ch=o.c===0?"бе тағйир":(o.c>0?"+":"−")+fmtR(Math.abs(o.c),4);
    return `<div class="row a-slide" style="--d:${d}s">
      <div class="badge"><b>${sym}</b></div>
      <div class="cur"><small>${name}</small><strong>${code}</strong></div>
      ${trend(o.c,d+.3)}
      <div class="val"><div class="n" data-to="${o.v}" data-k="r">${fmtR(o.v,4)}</div>
        <span class="pill ${cls}">${ch}</span></div>
    </div>`};
  el.innerHTML=`
    <span class="mask wd"><span style="--d:.15s">${esc(D.wd)}</span></span>
    <span class="mask date"><span style="--d:.28s">${esc(D.dt)}</span></span>
    <div class="label"><span class="mask"><span style="--d:.45s">Обу ҳаво · °C</span></span><i class="a-line" style="--d:.5s"></i><span class="mask src"><span style="--d:.55s">${esc(D.src)}</span></span></div>
    <div class="grid">${cities}</div>
    <div class="label"><span class="mask"><span style="--d:1.55s">Қурби БМТ · сомонӣ</span></span><i class="a-line" style="--d:1.6s"></i></div>
    <div class="card fx a-pop" style="--d:1.55s;--sd:4.2s">
      ${D.rub?row("₽","Рубли Русия","RUB",D.rub,1.75):""}
      ${row("$","Доллари ИМА","USD",D.usd,1.9)}
      ${row("€","Евро","EUR",D.eur,2.05)}
    </div>`;
}


const MON=["январ","феврал","март","апрел","май","июн","июл","август","сентябр","октябр","ноябр","декабр"];
const WD=["якшанбе","душанбе","сешанбе","чоршанбе","панҷшанбе","ҷумъа","шанбе"];
const LOGO=`<svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
  <path d="M10 60a50 50 0 0 0 100 0" stroke="#16243A" stroke-opacity=".22" stroke-width="8" stroke-linecap="round"/>
  <path d="M10 60a50 50 0 0 1 100 0" stroke="#F09A2E" stroke-width="8" stroke-linecap="round"/>
  <path d="M60 94v7" stroke="#16243A" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"/>
  <g stroke="#F09A2E" stroke-width="4" stroke-linecap="round"><path d="M40 22v-5M40 62v5M20 42h-5M60 42h5M26 28l-3-3M54 56l3 3M26 56l-3 3M54 28l3-3" stroke-opacity=".9"/></g>
  <circle cx="40" cy="42" r="12" fill="#F09A2E"/>
  <g class="hand"><path d="M60 60h30" stroke="#16243A" stroke-width="6" stroke-linecap="round"/></g>
  <circle cx="60" cy="60" r="7" fill="#F09A2E" stroke="#fff" stroke-width="3"/></svg>`;
function render(){
  const D=data, el=document.getElementById("content"), day=new Date(D.date+"T07:00:00"), o=.35;
  const cities=D.cities.map((c,i)=>{const d=(o+.62+i*.12).toFixed(2);
    return `<div class="card city a-pop" style="--d:${d}s;--sd:${3+i*.25}s">
      <div class="cname">${esc(c.n)}</div>
      <div class="ico a-ico" style="--d:${(+d+.25).toFixed(2)}s">${icon(c.c)}</div>
      <div class="tblock"><div class="temp"><span data-to="${c.mx}" data-k="t">${fmtT(c.mx)}</span><sup>°</sup></div>
        <div class="min">${fmtT(c.mn)}°</div></div>
      <div class="cond">${esc(c.t||ICONS[c.c])}</div></div>`}).join("");
  const row=(sym,name,code,x,d)=>{const cls=x.c>0?"up":x.c<0?"down":"flat";
    const ch=x.c===0?"бе тағйир":(x.c>0?"+":"−")+fmtR(Math.abs(x.c),4);
    return `<div class="row a-slide" style="--d:${d}s"><div class="badge"><b>${sym}</b></div>
      <div class="cur"><small>${name}</small><strong>${code}</strong></div>${trend(x.c,d+.3)}
      <div class="val"><div class="n" data-to="${x.v}" data-k="r">${fmtR(x.v,4)}</div><span class="pill ${cls}">${ch}</span></div></div>`};
  el.innerHTML=`<div class="head">
      <div class="brandrow"><div class="logo a-logo">${LOGO}</div><div class="title a-title"><span>Обу ҳаво</span><span>қурби асъор</span></div></div>
      <div class="sub a-in" style="--d:.45s"><i></i><span><b>${day.getDate()} ${MON[day.getMonth()]}</b> (${WD[day.getDay()]})</span><i></i></div></div>
    <div class="label"><span class="mask"><span style="--d:${o+.45}s">Ҳарорат · °C</span></span><i class="a-line" style="--d:${o+.5}s"></i><span class="mask src"><span style="--d:${o+.55}s">${esc(D.src)}</span></span></div>
    <div class="grid">${cities}</div>
    <div class="label"><span class="mask"><span style="--d:${o+1.55}s">Қурби БМТ · сомонӣ</span></span><i class="a-line" style="--d:${o+1.6}s"></i></div>
    <div class="card fx a-pop" style="--d:${o+1.55}s;--sd:4.2s">
      ${D.rub?row("₽","Рубли Русия","RUB",D.rub,o+1.75):""}${row("$","Доллари ИМА","USD",D.usd,o+1.9)}${row("€","Евро","EUR",D.eur,o+2.05)}</div>`;
  const T=el.querySelector(".title"),R=el.querySelector(".brandrow");let ts=D.ts||80;T.style.fontSize=ts+"px";
  while(R.scrollWidth>936&&ts>64){ts-=2;T.style.fontSize=ts+"px"}
  return {ts, bottom: el.querySelector(".fx").getBoundingClientRect().bottom};
}
function updateCounts(t){
  document.querySelectorAll("#content [data-to]").forEach(n=>{
    const to=+n.dataset.to,k=n.dataset.k,delay=k==="t"?1.2:2.25,dur=1.1;
    const p=Math.min(1,Math.max(0,(t-delay)/dur)),e=1-Math.pow(1-p,4);
    const from=k==="t"?0:to*0.97,v=from+(to-from)*e;
    n.textContent=k==="t"?fmtT(v):fmtR(v,4);
  });
}

const DUR=15;
window.renderSetup=function(d){data=d;const st=document.getElementById("stage");const r=render();st.classList.remove("play");void st.offsetWidth;st.classList.add("play");
  document.getAnimations().forEach(a=>{a.currentTime=0;a.pause()});seek(0);return Object.assign({dur:DUR},r)};
window.seek=function(t){document.getAnimations().forEach(a=>{a.currentTime=t*1000});updateCounts(t)};
(function(){let h="";for(let i=0;i<14;i++){h+=`<span class="dot" style="left:${(i*73)%1040}px;top:${900+(i*131)%900}px;animation-delay:-${(i*.7).toFixed(1)}s;animation-duration:${8+i%5}s"></span>`}document.getElementById("dots").innerHTML=h})();
</script></body></html>
